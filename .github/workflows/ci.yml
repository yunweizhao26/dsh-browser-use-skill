name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax
        run: node --check index.js

      - name: Manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"

      - name: Bundle manifest declares a patch
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); console.log('patch:', p.dsh.bundle.patch)"

      - name: Skill frontmatter is present
        run: |
          head -3 skills/browser-use/SKILL.md | grep -q '^---$'
          grep -q '^name: browser-use$' skills/browser-use/SKILL.md
          grep -q '^description:' skills/browser-use/SKILL.md

      - name: Packed file list
        run: npm pack --dry-run
